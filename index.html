<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RentConnect Kenya</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>RentConnect</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Find a House</a>
            <a href="#">List a House</a>
            <a href="#">Login</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">

            <h2>Find Your Next Home in Kenya</h2>

            <p>
                Find affordable houses and connect directly
                with landlords across Kenya.
            </p>

            <button>Find a House</button>

            <button>List Your Property</button>

        </section>


        <!-- Search Section -->
        <section class="search">

            <h2>Search for a House</h2>

            <input
                type="text"
                placeholder="Enter location"
            >

            <input
                type="number"
                placeholder="Maximum rent"
            >

            <button>Search</button>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 RentConnect Kenya
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
